<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Find Nearby Restaurants with MapLibre and Geoapify Places API</title>
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css" inline>

  </head>

  <body>
    <header class="sample-panel">
      <div class="sample-panel__intro">
        <h1>Find nearby restaurants with MapLibre and Geoapify Places API</h1>
        <p>
          Click the map to search restaurants with the
          <a href="https://www.geoapify.com/places-api/" target="_blank" rel="noopener">Geoapify Places API</a>
          and show cuisine-based pins generated by the
          <a href="https://www.geoapify.com/map-marker-icon-api/" target="_blank" rel="noopener">Geoapify Map Marker API</a>.
        </p>
      </div>
    </header>
    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <script src="script.js" inline></script>

  </body>

</html>

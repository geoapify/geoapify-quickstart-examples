<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Add Waypoints - Leaflet</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    >
    <link
      rel="stylesheet"
      href="https://unpkg.com/@geoapify/geocoder-autocomplete@3.0.1/styles/round-borders.css"
    >
    <link
      rel="stylesheet"
      href="https://unpkg.com/@geoapify/route-waypoint-selector@1.0.0/styles/core.css"
    >
    <link
      rel="stylesheet"
      href="https://unpkg.com/@geoapify/route-waypoint-selector@1.0.0/styles/theme-round-borders.css"
    >
    <link rel="stylesheet" href="style.css" inline inline>
  </head>
  <body>
    <div class="app-shell">
      <aside class="controls-panel">
        <div class="controls-panel__inner">
          <h1>Route Add Waypoints</h1>
          <p class="controls-panel__intro">
            Add stops in the panel or click the map to build a route with markers and turn-by-turn directions.
          </p>
          <p class="controls-panel__intro controls-panel__meta">
            Built with
            <a href="https://www.npmjs.com/package/@geoapify/route-waypoint-selector" target="_blank" rel="noreferrer">@geoapify/route-waypoint-selector</a>,
            <a href="https://apidocs.geoapify.com/docs/routing/" target="_blank" rel="noreferrer">Routing API</a>,
            <a href="https://apidocs.geoapify.com/docs/geocoding/reverse-geocoding/" target="_blank" rel="noreferrer">Reverse Geocoding API</a>,
            and
            <a href="https://apidocs.geoapify.com/docs/ip-geolocation/" target="_blank" rel="noreferrer">IP Geolocation API</a>.
          </p>

          <section class="control-group">
            <h2>Stops</h2>
            <div id="waypoint-selector"></div>
          </section>

          <section id="directions-panel" class="control-group is-hidden">
            <div class="directions-header">
              <h2>Directions</h2>
              <div id="route-summary">Add at least two resolved stops</div>
            </div>
            <div id="route-error" class="route-error is-hidden"></div>
            <ol id="route-instructions" class="route-instructions"></ol>
          </section>
        </div>
      </aside>

      <main class="map-panel">
        <div id="map"></div>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="importmap">
      {
        "imports": {
          "@geoapify/geocoder-autocomplete": "https://unpkg.com/@geoapify/geocoder-autocomplete@3.0.1/dist/index.min.esm.js",
          "@geoapify/route-waypoint-selector": "https://unpkg.com/@geoapify/route-waypoint-selector@1.0.0/dist/index.js"
        }
      }
    </script>
    <script type="module" src="script.js" inline inline></script>
  </body>
</html>

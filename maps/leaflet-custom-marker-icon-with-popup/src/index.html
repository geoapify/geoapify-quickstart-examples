<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Custom Marker Icons with Popups on a Leaflet Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="style.css" inline>
  </head>

  <body>
    <div class="app-shell">
      <aside class="control-panel">
        <h1>Custom Markers</h1>
        <p class="panel-description">
          Marker Icon API pins on a Leaflet map. Click a marker to open its popup.
        </p>
        <div class="status-box" id="status-box">Loading...</div>
      </aside>

      <main class="map-stage">
        <div id="my-map"></div>
      </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="script.js" inline></script>
  </body>

</html>
